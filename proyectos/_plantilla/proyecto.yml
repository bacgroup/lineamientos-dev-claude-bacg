# Plantilla de proyecto de BACG. Copiala a proyectos/<id>/proyecto.yml del repo central de lineamientos
# (bacgroup/lineamientos-dev-claude-bacg) y sumá el proyecto a proyectos/registro.yml. Cada repo del proyecto lleva
# `.bacg-lineamientos` con `proyecto: <id>` y `.claude/settings.json` (ver plantillas/repo-proyecto/).
#
# Los valores son ejemplos de la arquitectura de referencia de BACG (Odoo + n8n + AWS, PROD por rama y conectores MCP
# de PROD declarados): reemplazalos por los del proyecto. Nada se supone: el stack es el que se declara o se detecta.
# Otro stack (Supabase + Lovable, Postgres propio, sin base) se declara con `datos`, `entornos.prod`, `lovable` y
# `agentes_externos`; ver el pie.

version_ciclo: 4                # numeración de etapas del ciclo (0-6); sin la clave, skills_requeridas se lee en la de 3.x
id: mi-proyecto                 # identificador corto; el `proyecto:` de .bacg-lineamientos
nombre: Mi Proyecto             # nombre legible
cuenta_github: bacgroup         # org o cuenta dueña de los repos

repos:                          # un elemento por repo del proyecto (los RQ multi-repo sólo vinculan repos declarados)
  - nombre: mi-docker           # nombre del repo en GitHub
    rol: padre                  # padre | addons | sede | otro (informativo, salvo sede)
    push_prod: true             # true = publica a PROD (es el valor si falta); false explícito = repo que no publica
    # ramas_prod: ["18.0"]      # opcional: manda sobre el del proyecto
    # ruta_local: "C:/ruta/a/mi-docker"  # opcional: sin ella, el repo se busca clonado junto a los demás
  - nombre: mi-addons
    rol: addons
    push_prod: true

# Base de datos.
datos:
  # motor: odoo                 # odoo | supabase | postgres | otro | ninguno. Sin declarar, se detecta: Odoo si el repo
  #                             # tiene algún __manifest__.py a 3 niveles o menos de la raíz; Supabase si declara
  #                             # supabase_refs o proyectos de Lovable. Declaralo si la detección no alcanza.
  #                             # odoo_skills: false (en la raíz del archivo) apaga las skills de Odoo aunque se detecte.
  migraciones: ["**/migrations/**"]   # globs: disparan "Toca: migraciones"; [] = sin migraciones
  aplicar: "Las aplica Odoo al actualizar el módulo (-u) en el deploy"   # lo muestra `rq.mjs desplegar`

# PROD por rama: sólo un push o merge a estas ramas es PROD. La rama de DEV pide tests y revisión, no el OK de PROD.
# --all, --mirror y una rama que no se puede resolver siguen siendo PROD. Sin la clave, todo push es PROD.
ramas_prod: ["18.0"]

entornos:
  local:
    app: "http://localhost:8069"
  dev:
    tipo: rama                  # rama | url | lovable-preview | ninguno (informativo: lo muestra el arranque)
    rama: 18.0-dev
    url: "https://dev.ejemplo.com"
  prod:
    url: "https://prod.ejemplo.com"
    # bases: [erp-prod]         # bases de PROD con pasos sql:<id> en el circuito (si se aplica SQL a mano)

# Conectores MCP que tocan PROD. Leer pasa; toda otra herramienta del servidor pide RQ activo + OK de PROD.
# servidor = el segmento de mcp__<servidor>__<herramienta> (nombre o id del conector).
mcp_prod:
  - servidor: n8n-prod
    tipo: n8n                   # n8n | odoo | generico: define qué herramientas son de lectura
    # lectura: ["get_user_preferences"]   # herramientas extra de sólo lectura
    # ids_prod: ["<workflowId>"]          # si DEV y PROD comparten instancia: sólo estos ids son PROD
  # - servidor: odoo-prod
  #   tipo: odoo                # con execute_kw/call_kw, decide `method` (search_read pasa; write/create/unlink no)

# Skills de BACG que la CLI exige (además de las de proceso). etapa 2 (desarrollo) | 3 (verificación) | 5 (PROD);
# tipo rq | bug; rutas opcionales.
skills_requeridas:
  - { etapa: 2, skill: "anthropic-skills:bacg-n8n-guidelines", rutas: ["**/n8n/**"] }
  - { etapa: 5, skill: "anthropic-skills:bacg-n8n-pasaje-prod", rutas: ["**/n8n/**"] }
  # - { etapa: 2, skill: "anthropic-skills:bacg-diagnostico-bugs", tipo: bug }

# Pasos de publicación: cada uno espera a los de su despues_de (sin la clave, a todos los anteriores). Los manuales no
# bloquean el cierre: quedan pendientes del usuario.
circuito_prod:
  - paso: "push:mi-addons"      # push:<repo> | sql:<base> | merge-prs-sync:<repo> | sync-lineamientos | manual:<texto>
  - paso: "push:mi-docker"
  - paso: "manual:verificar-en-dev-y-promover-18.0"

ui:
  patrones: ["**/static/src/**", "**/views/**/*.xml", "**/*.scss"]
  skills: []                    # skills que suma editar un archivo de UI; el plugin siempre pide diseno-frontend
  reglas: []                    # excepciones por patrón: [{ patrones: [...], skills: [...] }]
  canon: reglas.md              # canon de UI dentro de proyectos/<id>/

sensible:                       # rutas cuyo cambio pide claude-security
  rutas: ["**/security/**", "**/ir.model.access.csv", ".github/workflows/**", "Dockerfile*", "**/migrations/**"]

# Comandos portables (nube y cualquier PC): {raiz} = este repo, {repo:<nombre>} = otro repo del proyecto clonado en
# la máquina; ponelos entre comillas. {archivos} = lo que está en stage; {specs} = los E2E del RQ. Corren con el shell
# del sistema (cmd.exe en Windows) salvo `shell: bash`.
tests:
  # shell: bash
  unit: "node \"{repo:mi-docker}/qa/odoo-test.mjs\" {archivos}"
  rojos_conocidos: []
  componentes: ""
  sql: ""
  e2e: "node \"{repo:mi-docker}/qa/e2e.mjs\" {specs}"
  e2e_url: "http://localhost:8070"
  cobertura_cambios_min: 80

# --- Otro stack (no es parte de la plantilla) ---------------------------------------------------------------------
# Supabase + Lovable: datos: { motor: supabase, migraciones: ["supabase/migrations/**"] };
#   entornos.prod.supabase_refs: [<ref>]; lovable: { workspace_id: "", proyectos: { <repo>: "<id>" } };
#   circuito con "sql:<ref>" antes de "push:<repo>" y "manual:publicar-en-lovable".
# Agentes que commitean sin el plugin: agentes_externos: { nombre: "Codex", autores: ["chatgpt-codex-connector[bot]"] }
