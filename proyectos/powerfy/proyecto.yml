# Contrato de Powerfy ERP (Odoo 18 CE). Vive en el repo central de lineamientos; los repos de PowerFy no llevan archivos
# del plugin (se reconocen por su remoto bacgroup/<nombre>). Infra: powerfy-docker/docs/AMBIENTES.md.

version_ciclo: 4                       # etapas 0-6 (plugin 4.x)
id: powerfy
nombre: Powerfy ERP
cuenta_github: bacgroup                # se opera con la cuenta gh nlopez-bacg (nkick25: invitar como colaborador si opera Powerfy)

# Cada dev trabaja en una rama propia (rq/<código>) y entra a 18.0-dev sólo por PR (ramas_solo_pr): ahí convergen los
# cambios de todos y despliega a DEV. PROD es el fast-forward 18.0-dev → 18.0.
# ruta_local: los de la PC de Nico; en otra PC no hace falta si los repos están clonados uno junto al otro.
repos:
  - { nombre: powerfy-docker, rol: padre, push_prod: true, ruta_local: "C:/MiCarpeta/Odoo DEVs/PowerFy/powerfy-docker" }   # build, CI y deploy
  - { nombre: powerfy-addons, rol: addons, push_prod: true, ruta_local: "C:/MiCarpeta/Odoo DEVs/PowerFy/powerfy-addons" }
  - { nombre: powerfy-ai,     rol: addons, push_prod: true, ruta_local: "C:/MiCarpeta/Odoo DEVs/PowerFy/powerfy-ai" }
  - { nombre: powerfy-bi,     rol: addons, push_prod: true, ruta_local: "C:/MiCarpeta/Odoo DEVs/PowerFy/powerfy-bi" }
  - { nombre: powerfy-l10n,   rol: addons, push_prod: true, ruta_local: "C:/MiCarpeta/Odoo DEVs/PowerFy/powerfy-l10n" }

# Stack (handoff 2026-10-29, P1): Odoo, migraciones de módulos; PROD es sólo la rama 18.0 (18.0-dev es DEV).
datos:
  motor: odoo
  migraciones: ["**/migrations/**"]
  aplicar: "Las aplica Odoo al actualizar el módulo (-u) en el deploy de la imagen 18.0"

ramas_prod: ["18.0"]
ramas_solo_pr: ["18.0-dev"]           # push directo a 18.0-dev: no; PR a 18.0-dev: sí

# Conectores MCP de PROD (PLG-MCP): completar con el segmento real de mcp__<servidor>__ de cada conector.
# mcp_prod:
#   - { servidor: "<n8n de PROD>", tipo: n8n }
#   - { servidor: "<Odoo de PROD>", tipo: odoo }

entornos:
  local:
    app: "http://localhost:8069"       # docker compose -f "C:/MiCarpeta/Odoo DEVs/PowerFy/docker-compose.local.yml", base `powerfy`
    e2e: "http://localhost:8070"       # contenedor powerfy-e2e, base powerfy_e2e (qa/e2e-db.mjs del workspace)
    db: "localhost:5544"               # 5432 y 5433 los ocupan PostgreSQL nativos de Windows
  dev:
    tipo: rama
    rama: 18.0-dev
    url: "https://dev.powerfy.cloud"
  prod:
    rama: "18.0"
    url: "https://prod.powerfy.cloud"
    derivados: ["https://demo.powerfy.cloud", "https://www.powerfy.io"]   # misma imagen de 18.0, deploy manual vía ECR
    supabase_refs: []                  # Powerfy no usa Supabase

lovable:
  workspace_id: ""
  proyectos: {}

# Un commit que sólo toca un repo de addons no dispara deploy-dev.yml: hay que correrlo a mano.
circuito_prod:
  - paso: "push:powerfy-addons"
  - paso: "push:powerfy-ai"
  - paso: "push:powerfy-bi"
  - paso: "push:powerfy-l10n"
  - paso: "push:powerfy-docker"
  - paso: "manual:verificar-en-dev-y-promover-18.0"     # gh workflow run deploy-dev.yml si no hubo push a powerfy-docker; ff a 18.0 revisando el delta de powerfy-docker
  - paso: "manual:deploy-demo-y-resnapshot-golden"      # si el cambio toca módulos instalados en DEMO
  - paso: "manual:deploy-web"                           # sólo si afecta a www.powerfy.io

ui:
  patrones: ["**/static/src/**", "**/views/**/*.xml", "**/*.scss", "**/templates/**/*.xml"]
  skills: []
  reglas: []
  canon: reglas.md                     # sin canon de UI propio todavía; paleta y gotchas en reglas.md

sensible:
  rutas: ["**/security/**", "**/ir.model.access.csv", "**/powerfy_security/**", "**/powerfy_roles/**",
          ".github/workflows/**", "Dockerfile*", "docker-compose*.yml", "config/**", "nginx/**", "**/migrations/**"]

# Los tests los corre cada dev en su PC, con su entorno local de Odoo: cada uno declara sus comandos en
# ~/.claude/bacg-dev.json (proyectos.powerfy.tests), que mandan sobre estos. Acá queda lo común a todos.
tests:
  unit: ""                             # en tu PC: tests de Odoo de los módulos en stage ({archivos}); --completo = CI
  rojos_conocidos: []
  componentes: ""                      # tests JS/tours de Odoo: la imagen no trae Chrome; lo cubre el E2E
  sql: ""                              # no aplica: los modelos se prueban en unit
  e2e: ""                              # en tu PC: Playwright contra tu Odoo local ({specs} = los del RQ)
  e2e_url: "http://localhost:8070"
  e2e_chequear_url: false              # qa/e2e.mjs levanta y baja el Odoo del 8070 en cada corrida
  e2e_requisitos:                      # el arranque los chequea y lo dice en una línea (Docker apagado, etc.)
    - nombre: "Docker"
      comando: 'docker version --format "{{.Server.Version}}"'
    - nombre: "contenedor powerfy-local-odoo-1"
      comando: 'docker ps -q -f "name=^powerfy-local-odoo-1$" -f "status=running"'
      con_salida: true
  cobertura_cambios_min: 80            # todavía sin medición (coverage.py no está en la imagen)
