# Traza del spec al código y a los tests (rq.mjs trazar). estado: hecho | parcial | fuera (con motivo).
# Un "hecho" lleva el test que prueba el comportamiento, no sólo que aparece un texto.
items:
  - id: S-1
    texto: '`general/seguridad.md` tiene el checklist con 10 a 14 puntos, cada uno con "qué mirar en el diff" y su referencia (OWASP, ISO 27001 Anexo A, SOC 2 CC) → test de manifiestos/contenido que verifica la sección y que cada punto tiene referencia.'
    archivos:
      - plugin/general/seguridad.md
    test: 'tests/seguridad-checklist.test.mjs · el checklist tiene de 10 a 14 puntos, cada uno con qué mirar en el diff y su referencia; define crítico, no aplica y referencia'
    estado: hecho
  - id: S-2
    texto: '`revisor-rq` incluye la pasada de seguridad de aplicación con el checklist, sólo sobre lo que el diff toca → mismo test (el agente nombra `general/seguridad.md`).'
    archivos:
      - plugin/agents/revisor-rq.md
      - plugin/skills/ciclo-rq/SKILL.md
    test: 'tests/seguridad-checklist.test.mjs · revisor-rq aplica el checklist sólo a lo que el diff toca, y ciclo-rq lo nombra en la revisión'
    estado: hecho
